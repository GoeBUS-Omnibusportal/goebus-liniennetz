# GöBUS – DELFI-Fahrplan automatisch einspielen
# Angestoßen alle 30 Minuten von cron-job.org (workflow_dispatch); dazu alle 6 Stunden von GitHub selbst als Sicherheitsnetz.
# Einrichten: Settings → Secrets and variables → Actions
#   Variables: GOEBUS_ADRESSE = https://www.goebus.de/_admin/
#   Secrets:   GOEBUS_SCHLUESSEL = persönlicher Schlüssel eines Administrators (GöBUS → Web-Import → Skript einrichten)
name: GöBUS DELFI-Fahrplan
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
concurrency:
  group: goebus-delfi
  cancel-in-progress: false
permissions: {}
jobs:
  delfi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Neuen Fahrplan prüfen und einspielen
        env:
          GOEBUS_ADRESSE: ${{ vars.GOEBUS_ADRESSE }}
          GOEBUS_SCHLUESSEL: ${{ secrets.GOEBUS_SCHLUESSEL }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 -H "X-Sync-Token: $GOEBUS_SCHLUESSEL" "${GOEBUS_ADRESSE%/}/index.php?api=delfi&aktion=automatik" -o automatik.py
          python3 automatik.py