# GöBUS – Liniennetze aus Fahrplandaten (GTFS) und OpenStreetMap erzeugen (Skript 2.2, Fassung 28)
# Läuft montags und donnerstags früh, nach jedem Hochladen von liniennetz.py oder verbuende.json und jederzeit von Hand („Run workflow“).
name: Liniennetz aktualisieren

on:
  schedule:
    - cron: '23 3 * * 1,4'   # montags und donnerstags 03:23 Uhr (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['liniennetz.py', 'verbuende.json', 'landkreise.topo.json', '.github/workflows/liniennetz.yml']

concurrency:
  group: liniennetz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  liniennetz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fahrplandaten und OpenStreetMap verarbeiten
        # Version 2.2: Regeln der Website (ersetzte Linien wie 265 → 260). Adresse der Website als Variable GOEBUS_ADRESSE
        # (Settings → Secrets and variables → Actions → Variables); ohne Variable läuft alles wie bisher.
        env:
          GOEBUS_REGELN: ${{ vars.GOEBUS_ADRESSE != '' && format('{0}/_data/verbund-tarife/linien-regeln.json', vars.GOEBUS_ADRESSE) || '' }}
        run: python liniennetz.py --ausgabe daten

      - name: Ergebnis speichern
        run: |
          git config user.name "GöBUS Liniennetz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Liniennetz $(date +%F)"
            git push
          fi
