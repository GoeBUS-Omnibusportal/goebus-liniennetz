# GöBUS – Liniennetze aus Fahrplandaten (GTFS) und OpenStreetMap erzeugen (Skript 2.4); Fahrschulen (Fassung 42); Fahrplanseiten (Fassung 46)
# Fassung 50: Der Job „fahrplanseiten“ speichert wieder die Kopien der Seiten (daten/fahrplanseiten/*.html) – Fassung 48 legte nur
#   fahrplanseiten.json ab, die Website fand die Kopien nicht (404). fahrplanseiten.py 1.1 legt die Seiten zusätzlich in die Übersicht.
# Fassung 49: Ubuntu 24.04 fest (ubuntu-latest wechselt zu Ubuntu 26), checkout@v5 und setup-python@v6 (Node.js 24 statt 20),
#   fehlende Bundesländer brechen den Auszug nicht ab, „Ergebnis speichern“ holt vorher fremde Commits (Hochladen während des Laufs).
# Fassung 48:
#   – Fahrplanseiten (RVHI/ROSA) als eigener, schneller Job: läuft parallel und wird sofort gespeichert – unabhängig davon,
#     wie lange das Liniennetz braucht (vorher kam der Schritt nie an die Reihe, weil der Lauf nach 90 Minuten abbrach).
#   – OpenStreetMap aus den Auszügen der Geofabrik (Niedersachsen, Hessen, Thüringen, Regierungsbezirk Detmold) statt Overpass:
#     die öffentlichen Overpass-Server waren von GitHub aus nicht erreichbar (Network is unreachable, 502, 504) und
#     kosteten je Versuch mehrere Minuten. Nur wenn der Auszug fehlt, wird Overpass noch gefragt (höchstens 12 Minuten).
# Läuft montags und donnerstags früh, nach jedem Hochladen der Skripte und jederzeit von Hand („Run workflow“).
name: Liniennetz aktualisieren

on:
  schedule:
    - cron: '23 3 * * 1,4'   # montags und donnerstags 03:23 Uhr (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['liniennetz.py', 'fahrschulen.py', 'fahrplanseiten.py', 'verbuende.json', 'landkreise.topo.json', '.github/workflows/liniennetz.yml']

concurrency:
  group: liniennetz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fahrplanseiten:
    # Der Webserver erreicht extern.gipsprojekt.de nicht (RVHI, ROSA). GitHub lädt die Fahrplantabellen, die Website liest
    # die Kopie daten/fahrplanseiten.json. Dauert wenige Minuten.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fahrplanseiten der Verbünde zwischenspeichern
        env:
          GOEBUS_REGELN: ${{ vars.GOEBUS_ADRESSE != '' && format('{0}/_data/verbund-tarife/linien-regeln.json', vars.GOEBUS_ADRESSE) || '' }}
        run: python fahrplanseiten.py --ausgabe daten

      - name: Ergebnis speichern
        run: |
          git config user.name "GöBUS Fahrplanseiten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/fahrplanseiten.json daten/fahrplanseiten   # Fassung 50: auch die Kopien selbst (Fassung 48 speicherte nur die Übersicht)
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Fahrplanseiten $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 10; done
          exit 1

  liniennetz:
    runs-on: ubuntu-24.04
    timeout-minutes: 110    # Fassung 59: Skizzen über die Straßen bis zu 45 Minuten je Lauf
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: OpenStreetMap-Auszüge laden (Geofabrik)
        # Ganze Bundesländer als Datei (zusammen gut 1,4 GB, Laden 1–3 Minuten), daraus mit osmium nur Buslinien und Fahrschulen.
        # Schlägt dieser Schritt fehl, fragen die Skripte Overpass (mit Zeitbegrenzung) – der Lauf geht weiter.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null)
          mkdir -p osm
          for land in niedersachsen hessen thueringen nordrhein-westfalen/detmold-regbez; do
            n=$(basename "$land")
            echo "$(date +%T) Lade $land"
            # Fassung 49: ein fehlendes Bundesland bricht den Schritt nicht ab – die übrigen werden trotzdem genutzt
            if curl -fsSL --retry 3 --retry-delay 15 --connect-timeout 30 -o "osm/$n.osm.pbf" "https://download.geofabrik.de/europe/germany/$land-latest.osm.pbf" \
               && osmium tags-filter "osm/$n.osm.pbf" r/route=bus,trolleybus,minibus,share_taxi,tram nwr/amenity=driving_school -o "osm/$n-teil.osm.pbf" --overwrite; then
              # Fassung 59: Gemeindegrenzen für AST-Gebiete („Gemeinde Rosdorf“) – Fehler hier bremsen nichts
              osmium tags-filter "osm/$n.osm.pbf" r/boundary=administrative -o "osm/$n-grenzen.osm.pbf" --overwrite || echo "::warning::Grenzen $land nicht gefiltert"
              echo "$(date +%T) $land fertig"
            else
              echo "::warning::OpenStreetMap-Auszug $land nicht geladen – weiter ohne dieses Gebiet"
            fi
            rm -f "osm/$n.osm.pbf"
          done
          ls osm/*-teil.osm.pbf >/dev/null 2>&1 || { echo "::warning::Kein Auszug geladen – das Skript fragt Overpass"; exit 0; }
          osmium merge osm/*-teil.osm.pbf -o osm/alles.osm.pbf --overwrite
          osmium tags-filter osm/alles.osm.pbf r/route=bus,trolleybus,minibus,share_taxi,tram -o osm/routen.osm.pbf --overwrite
          osmium cat osm/routen.osm.pbf -f opl,add_metadata=false -o osm/auszug.opl --overwrite
          osmium tags-filter osm/alles.osm.pbf nwr/amenity=driving_school -o osm/fahrschulen.osm.pbf --overwrite
          osmium cat osm/fahrschulen.osm.pbf -f opl,add_metadata=false -o osm/fahrschulen.opl --overwrite
          # Fassung 59: Gemeinden und Samtgemeinden (admin_level 7 und 8) als Flächen für AST-Gebiete
          if ls osm/*-grenzen.osm.pbf >/dev/null 2>&1; then
            ( osmium merge osm/*-grenzen.osm.pbf -o osm/grenzen.osm.pbf --overwrite \
              && osmium tags-filter osm/grenzen.osm.pbf r/admin_level=7,8 -o osm/gemeinden.osm.pbf --overwrite \
              && osmium export osm/gemeinden.osm.pbf -f geojsonseq --geometry-types=polygon -o osm/gemeinden.geojsonseq --overwrite \
              && rm -f osm/*-grenzen.osm.pbf osm/grenzen.osm.pbf ) || echo "::warning::Gemeindegrenzen nicht erstellt – AST-Gebiete bleiben ohne Fläche"
          fi
          ls -la osm

      - name: Fahrplandaten und OpenStreetMap verarbeiten
        # Version 2.2: Regeln der Website (ersetzte Linien wie 265 → 260). Adresse der Website als Variable GOEBUS_ADRESSE
        # (Settings → Secrets and variables → Actions → Variables); ohne Variable läuft alles wie bisher.
        timeout-minutes: 70    # Fassung 59: Verarbeitung gut 6 Minuten + Skizzen bis 45 Minuten (Variable GOEBUS_SKIZZE_MINUTEN)
        env:
          GOEBUS_SKIZZE_MINUTEN: ${{ vars.GOEBUS_SKIZZE_MINUTEN || '45' }}
          GOEBUS_REGELN: ${{ vars.GOEBUS_ADRESSE != '' && format('{0}/_data/verbund-tarife/linien-regeln.json', vars.GOEBUS_ADRESSE) || '' }}
        run: python liniennetz.py --ausgabe daten --osm-auszug osm/auszug.opl --gemeinden osm/gemeinden.geojsonseq

      - name: Fahrschulen mit Busführerschein suchen
        # Fassung 42: OpenStreetMap (Fassung 48: aus dem Auszug) und Websites der Fahrschulen. Schlägt dieser Schritt fehl,
        # bleibt das Liniennetz davon unberührt.
        if: ${{ !cancelled() && hashFiles('fahrschulen.py') != '' }}
        continue-on-error: true
        timeout-minutes: 15
        run: python fahrschulen.py --ausgabe daten --osm-auszug osm/fahrschulen.opl

      - name: Ergebnis speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GöBUS Liniennetz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Liniennetz $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 10; done
          exit 1
