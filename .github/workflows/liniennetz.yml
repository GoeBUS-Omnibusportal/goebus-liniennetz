# GöBUS – Liniennetze aus Fahrplandaten (GTFS) und OpenStreetMap erzeugen (Skript 2.4); Fahrschulen (Fassung 42); Fahrplanseiten (Fassung 46)
# Fassung 50: Der Job „fahrplanseiten“ speichert wieder die Kopien der Seiten (daten/fahrplanseiten/*.html) – Fassung 48 legte nur
#   fahrplanseiten.json ab, die Website fand die Kopien nicht (404). fahrplanseiten.py 1.1 legt die Seiten zusätzlich in die Übersicht.
# Fassung 49: Ubuntu 24.04 fest (ubuntu-latest wechselt zu Ubuntu 26), checkout@v5 und setup-python@v6 (Node.js 24 statt 20),
#   fehlende Bundesländer brechen den Auszug nicht ab, „Ergebnis speichern“ holt vorher fremde Commits (Hochladen während des Laufs).
# Fassung 48:
#   – Fahrplanseiten (RVHI/ROSA) als eigener, schneller Job: läuft parallel und wird sofort gespeichert – unabhängig davon,
#     wie lange das Liniennetz braucht (vorher kam der Schritt nie an die Reihe, weil der Lauf nach 90 Minuten abbrach).
#   – OpenStreetMap aus den Auszügen der Geofabrik (Niedersachsen, Hessen, Thüringen, Regierungsbezirk Detmold) statt Overpass:
#     die öffentlichen Overpass-Server waren von GitHub aus nicht erreichbar (Network is unreachable, 502, 504) und
#     kosteten je Versuch mehrere Minuten. Nur wenn der Auszug fehlt, wird Overpass noch gefragt (höchstens 12 Minuten).
# Fassung 61: eigener Routenplaner (OSRM in Docker, Bus-Profil osrm-bus.lua) für die Skizzen, einmal je Woche gebaut.
# Läuft täglich früh (Fassung 60), nach jedem Hochladen der Skripte und jederzeit von Hand („Run workflow“).
name: Liniennetz aktualisieren

on:
  schedule:
    - cron: '23 3 * * *'     # Fassung 60: täglich 03:23 Uhr (UTC) – gtfs.de erneuert den Fahrplan fast täglich (vorher montags und donnerstags)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['liniennetz.py', 'schulverkehr.py', 'efahrten.py', 'fahrschulen.py', 'fahrplanseiten.py', 'verbuende.json', 'landkreise.topo.json', 'osrm-bus.lua', '.github/workflows/liniennetz.yml']

concurrency:
  group: liniennetz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fahrplanseiten:
    # Der Webserver erreicht extern.gipsprojekt.de nicht (RVHI, ROSA). GitHub lädt die Fahrplantabellen, die Website liest
    # die Kopie daten/fahrplanseiten.json. Dauert wenige Minuten.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fahrplanseiten der Verbünde zwischenspeichern
        env:
          GOEBUS_REGELN: ${{ vars.GOEBUS_ADRESSE != '' && format('{0}/_data/verbund-tarife/linien-regeln.json', vars.GOEBUS_ADRESSE) || '' }}
        run: python fahrplanseiten.py --ausgabe daten

      - name: Ergebnis speichern
        run: |
          git config user.name "GöBUS Fahrplanseiten"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/fahrplanseiten.json daten/fahrplanseiten   # Fassung 50: auch die Kopien selbst (Fassung 48 speicherte nur die Übersicht)
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Fahrplanseiten $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 10; done
          exit 1

  liniennetz:
    runs-on: ubuntu-24.04
    timeout-minutes: 175    # Fassung 59/60/61: Auszug bis 30, Routenplaner bis 35, Verarbeitung bis 80 (Skizzen bis 45, Fassung 69: E-Fahrten), Fahrschulen bis 15 Minuten
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Letzten OpenStreetMap-Auszug bereitlegen
        # Fassung 60: Am 19.11. lud Geofabrik für alle vier Gebiete nicht (und Overpass antwortete nicht) – der Lauf hatte dann
        # gar keine Linienwege aus OpenStreetMap. Jetzt liegt der letzte gute Auszug im Zwischenspeicher von GitHub bereit.
        uses: actions/cache/restore@v5   # Fassung 63: Node 24 (v4 lief noch mit Node 20)
        with:
          path: osm-vorrat
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Woche bestimmen
        # Fassung 61: Der eigene Routenplaner wird einmal je Woche neu gebaut (Straßen ändern sich selten)
        run: echo "WOCHE=$(date -u +%G-%V)" >> "$GITHUB_ENV"

      - name: Routenplaner-Daten bereitlegen
        id: osrmcache
        uses: actions/cache/restore@v5   # Fassung 63: Node 24 (v4 lief noch mit Node 20)
        with:
          path: osrm
          key: osrm-bus-v2-${{ env.WOCHE }}
          restore-keys: osrm-bus-v2-

      - name: Routenplaner neu bauen?
        if: ${{ steps.osrmcache.outputs.cache-hit != 'true' }}
        run: echo "OSRM_BAUEN=1" >> "$GITHUB_ENV"

      - name: Quellen prüfen
        # Fassung 61: Vor dem Laden prüft der Lauf von GitHub aus, welche Quellen antworten (Geofabrik, openstreetmap.fr,
        # Overpass, Routenplaner, Fahrplandaten, Website). Am 19. und 22.11.2026 lehnte Geofabrik jede Verbindung von GitHub ab
        # („Couldn't connect to server“, auch über IPv4) – Geofabrik sperrt bei Missbrauch ganze Adressbereiche, Overpass sperrt
        # Azure/AWS seit Oktober 2025. Das Ergebnis steht im Protokoll, in osm/quellen.json und danach in der Verwaltung.
        run: |
          mkdir -p osm
          pruefe() {  # Name, Adresse, Rolle (haupt | ersatz | reserve) – Fassung 64: Reserve nur kurz prüfen (vorher je 30 s Wartezeit)
            local t0=$(date +%s%3N) code rolle="${3:-haupt}" mt=30
            [ "$rolle" = reserve ] && mt=10
            code=$(curl -4 -s -o /dev/null -L -r 0-200 --connect-timeout 8 --max-time $mt -A "GoeBUS-Liniennetz (+https://goebus.de)" -w "%{http_code}" "$2" 2>/dev/null || true)
            [ -z "$code" ] && code=000
            local ms=$(( $(date +%s%3N) - t0 ))
            printf '%-28s %s  %5d ms  %s\n' "$1" "$code" "$ms" "$2"
            printf '{"name":"%s","url":"%s","code":"%s","ms":%d,"rolle":"%s"}\n' "$1" "$2" "$code" "$ms" "$rolle" >> osm/quellen.jsonl
            case "$code" in 2*|3*) return 0;; *) return 1;; esac
          }
          rm -f osm/quellen.jsonl
          echo "Quelle                       Code   Dauer     Adresse"
          # Fassung 65: Geofabrik legt die Dateien seit November 2026 in Unterordnern ab (…/germany/niedersachsen/niedersachsen-latest…);
          # der alte Pfad antwortet mit 404 – am 22.11. im Browser geprüft. Von GitHub aus antwortet Geofabrik wieder (404 statt keine Verbindung).
          # Fassung 68: Geofabrik wird mitten im Umbau geprüft – am 23.11. antworteten die .md5-Dateien (darum galt Geofabrik als
          # erreichbar), die Dateien selbst aber mit 503/502 bzw. 404 („…-latest“ leitet auf „niedersachsen-261122.osm.pbf“, die fehlt).
          # Jetzt wird für alle vier Gebiete die Datei selbst angefragt (erste Bytes, Weiterleitungen folgen); nur wenn alle antworten,
          # versucht der Lauf Geofabrik. Sonst gleich openstreetmap.fr – ohne viermal vier Minuten Wartezeit.
          geo_code=206; geo_url=""
          for land in niedersachsen hessen thueringen nordrhein-westfalen/detmold-regbez; do
            n=$(basename "$land"); u="https://download.geofabrik.de/europe/germany/$land/$n-latest.osm.pbf"
            c=$(curl -4 -s -o /dev/null -L -r 0-200 --connect-timeout 8 --max-time 20 -A "GoeBUS-Liniennetz (+https://goebus.de)" -w "%{http_code}" "$u" 2>/dev/null || true)
            case "$c" in 200|206) ;; *) geo_code="${c:-000}"; geo_url="$u"; break;; esac
          done
          if pruefe geofabrik "${geo_url:-https://download.geofabrik.de/europe/germany/niedersachsen/niedersachsen-latest.osm.pbf}" && [ -z "$geo_url" ]; then echo "OSM_GEOFABRIK=1" >> "$GITHUB_ENV"; \
          elif [ -n "$geo_url" ]; then echo "Geofabrik: $geo_url antwortet mit $geo_code – Geofabrik wird in diesem Lauf nicht versucht"; fi
          # openstreetmap.fr: die Datei selbst (Deutschland, rund 6 GB, Prüfsumme .md5, Stand .state.txt) – am 23.11. geladen in 3 Minuten
          if pruefe openstreetmap.fr "https://download.openstreetmap.fr/extracts/europe/germany-latest.osm.pbf" ersatz; then echo "OSM_FR=1" >> "$GITHUB_ENV"; fi
          pruefe overpass-api.de "https://overpass-api.de/api/status" reserve || true
          pruefe overpass.kumi.systems "https://overpass.kumi.systems/api/status" reserve || true
          pruefe overpass.private.coffee "https://overpass.private.coffee/api/status" reserve || true
          pruefe osrm-oeffentlich "https://router.project-osrm.org/route/v1/driving/9.926800,51.536500;9.935900,51.533200?overview=false" || true
          pruefe gtfs.de "https://download.gtfs.de/germany/free/latest.zip" || true
          pruefe ghcr.io "https://ghcr.io/v2/" || true
          # Fassung 62/63: die Website so prüfen, wie das Skript sie abruft (Python, gleiche Kennung, gleiche Adresse). Am 22.11. stand in
          # GOEBUS_ADRESSE die Adresse der Verwaltung („…/_admin/“) – das Skript macht daraus die Website, die Prüfung bisher nicht
          # (…/_admin//_data/… → 404, angezeigt als „keine Verbindung“). Jetzt gleiche Umrechnung und der echte HTTP-Code.
          if [ -n "${{ vars.GOEBUS_ADRESSE }}" ]; then
            t0=$(date +%s%3N)
            read -r code u < <(python3 - "${{ vars.GOEBUS_ADRESSE }}" <<'PY'
          import re, sys, urllib.error, urllib.request as ur
          a = re.sub(r'/_admin/*$', '', sys.argv[1].strip().rstrip('/'))
          u = a + '/_data/verbund-tarife/linien-regeln.json'
          try:
              c = ur.urlopen(ur.Request(u, headers={'User-Agent': 'GoeBUS-Liniennetz/3.3 (+https://www.goebus.de)'}), timeout=30).status
          except urllib.error.HTTPError as e:
              c = e.code
          except Exception:
              c = '000'
          print(c, u)
          PY
            )
            ms=$(( $(date +%s%3N) - t0 )); printf '%-28s %s  %5d ms  %s\n' goebus.de "${code:-000}" "$ms" "$u"
            printf '{"name":"%s","url":"%s","code":"%s","ms":%d}\n' goebus.de "$u" "$code" "$ms" >> osm/quellen.jsonl
          fi
          { echo '['; paste -sd, osm/quellen.jsonl; echo ']'; } > osm/quellen.json
          echo "GOEBUS_QUELLEN=$PWD/osm/quellen.json" >> "$GITHUB_ENV"
          # Alter des letzten guten Auszugs (Tage) – openstreetmap.fr (6 GB) nur laden, wenn der Vorrat älter als 2 Tage ist
          if [ -s osm-vorrat/stand.txt ]; then echo "OSM_VORRAT_TAGE=$(( ( $(date -u +%s) - $(date -u -d "$(cat osm-vorrat/stand.txt)" +%s) ) / 86400 ))" >> "$GITHUB_ENV"; fi

      - name: OpenStreetMap-Auszüge laden (Geofabrik, sonst openstreetmap.fr)
        # Geofabrik: vier Gebiete (zusammen gut 1,4 GB). Ist Geofabrik gesperrt: Deutschland von openstreetmap.fr (6 GB,
        # geprüft am 22.11.2026: Datei vorhanden, Stand 21.11.) und daraus der Ausschnitt der Region – höchstens alle 2 Tage,
        # dazwischen der letzte gute Auszug aus dem Zwischenspeicher. Daraus mit osmium nur Buslinien, Fahrschulen, Gemeinden
        # und (für den eigenen Routenplaner) Straßen.
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null)
          mkdir -p osm
          AGENT="GoeBUS-Liniennetz (+https://goebus.de)"
          teile() {  # Datei, Kurzname: Buslinien/Fahrschulen/Gemeinden und Straßen herausfiltern
            # Fassung 67: dazu Haltestellen und Orte (Schülerverkehr: Haltestellen verorten, die in den Fahrplandaten fehlen)
            osmium tags-filter "$1" r/route=bus,trolleybus,minibus,share_taxi,tram nwr/amenity=driving_school r/admin_level=7,8 n/highway=bus_stop n/public_transport=platform n/place=city,town,village,suburb,hamlet,isolated_dwelling -o "osm/$2-teil.osm.pbf" --overwrite || return 1
            if [ "${OSRM_BAUEN:-}" = 1 ]; then
              osmium tags-filter "$1" w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,busway,bus_guideway,road w/bus=yes,designated w/psv=yes,designated -o "osm/$2-strassen.osm.pbf" --overwrite \
                || echo "::warning::Straßen $2 nicht gefiltert – Routenplaner ohne dieses Gebiet"
            fi
          }
          # Fassung 68: Vorrat von heute und vollständig (auch Haltestellen und Gemeinden) → nichts neu laden (z. B. Lauf nach dem
          # Hochladen neuer Dateien wenige Stunden nach dem nächtlichen Lauf). Fehlt etwas im Vorrat, wird einmal neu geladen.
          VORRAT_VOLL=0
          if [ -s osm-vorrat/auszug.opl ] && [ -s osm-vorrat/halte.geojsonseq ] && [ -s osm-vorrat/gemeinden.geojsonseq ]; then VORRAT_VOLL=1; fi
          if [ "$VORRAT_VOLL" = 1 ] && [ -n "${OSM_VORRAT_TAGE:-}" ] && [ "${OSM_VORRAT_TAGE}" -lt 1 ] && [ "${OSRM_BAUEN:-}" != 1 ]; then
            echo "$(date +%T) Auszug von heute im Vorrat ($(cat osm-vorrat/stand.txt)) – kein neuer Download nötig"
            OSM_GEOFABRIK=""; OSM_FR=""; VORRAT_HEUTE=1
          fi
          if [ "${OSM_GEOFABRIK:-}" = 1 ]; then
            # Fassung 68: alle vier Gebiete oder keines – fehlt eines (am 23.11. 503/404), fehlten der Region sonst z. B. die Linien in Hessen
            geo_alle=1
            for land in niedersachsen hessen thueringen nordrhein-westfalen/detmold-regbez; do
              n=$(basename "$land")
              echo "$(date +%T) Lade $land (Geofabrik)"
              url="https://download.geofabrik.de/europe/germany/$land/$n-latest.osm.pbf"    # Fassung 65: neuer Pfad mit Unterordner
              if curl -fsSL --retry 2 --retry-all-errors --retry-delay 15 --connect-timeout 30 --max-time 900 -A "$AGENT" -o "osm/$n.osm.pbf" "$url"; then
                soll=$(curl -fsSL -A "$AGENT" "$url.md5" | cut -d' ' -f1 || true); ist=$(md5sum "osm/$n.osm.pbf" | cut -d' ' -f1)
                if [ -z "$soll" ] || [ "$soll" != "$ist" ]; then echo "::warning::Prüfsumme $land fehlt oder passt nicht – Datei verworfen"; rm -f "osm/$n.osm.pbf"; fi
              fi
              if [ ! -s "osm/$n.osm.pbf" ]; then geo_alle=0; echo "::warning::Geofabrik: $land nicht geladen – weiter mit openstreetmap.fr"; break; fi
            done
            if [ "$geo_alle" = 1 ]; then
              for land in niedersachsen hessen thueringen detmold-regbez; do
                teile "osm/$land.osm.pbf" "$land" || { geo_alle=0; echo "::warning::$land nicht lesbar"; break; }
              done
            fi
            if [ "$geo_alle" = 1 ]; then echo "$(date +%T) Geofabrik fertig (vier Gebiete)"; echo "OSM_QUELLE_DATEI=geofabrik" >> "$GITHUB_ENV"; else rm -f osm/*-teil.osm.pbf osm/*-strassen.osm.pbf; fi
            rm -f osm/niedersachsen.osm.pbf osm/hessen.osm.pbf osm/thueringen.osm.pbf osm/detmold-regbez.osm.pbf
          fi
          if ! ls osm/*-teil.osm.pbf >/dev/null 2>&1 && [ "${OSM_FR:-}" = 1 ] && { [ -z "${OSM_VORRAT_TAGE:-}" ] || [ "${OSM_VORRAT_TAGE}" -ge 2 ] || [ "${OSRM_BAUEN:-}" = 1 ] || [ "$VORRAT_VOLL" != 1 ]; }; then
            # Fassung 61: Ersatz für die gesperrte Geofabrik – Deutschland von openstreetmap.fr, Prüfsumme, Ausschnitt der Region
            echo "$(date +%T) Lade Deutschland (openstreetmap.fr, rund 6 GB)"
            if curl -fsSL --retry 4 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 1800 -A "$AGENT" -o osm/germany.osm.pbf "https://download.openstreetmap.fr/extracts/europe/germany-latest.osm.pbf"; then
              soll=$(curl -fsSL -A "$AGENT" "https://download.openstreetmap.fr/extracts/europe/germany.osm.pbf.md5" | cut -d' ' -f1 || true)
              ist=$(md5sum osm/germany.osm.pbf | cut -d' ' -f1)
              if [ -n "$soll" ] && [ "$soll" != "$ist" ]; then echo "::warning::Prüfsumme von openstreetmap.fr passt nicht ($ist statt $soll) – Datei verworfen"; rm -f osm/germany.osm.pbf; fi
              [ -z "$soll" ] && echo "::notice::openstreetmap.fr ohne Prüfsumme – Datei wird über osmium geprüft"
              osmium fileinfo osm/germany.osm.pbf >/dev/null 2>&1 || { echo "::warning::openstreetmap.fr: Datei nicht lesbar – verworfen"; rm -f osm/germany.osm.pbf; }
            fi
            if [ -s osm/germany.osm.pbf ]; then
              echo "$(date +%T) Ausschnitt der Region"
              osmium extract -b 8.2,50.6,11.8,52.9 osm/germany.osm.pbf -o osm/region.osm.pbf --overwrite && rm -f osm/germany.osm.pbf \
                && teile osm/region.osm.pbf region && echo "$(date +%T) Region fertig"
              rm -f osm/germany.osm.pbf osm/region.osm.pbf
              echo "OSM_QUELLE_DATEI=openstreetmap.fr" >> "$GITHUB_ENV"
            else
              echo "::warning::openstreetmap.fr nicht geladen"
            fi
          fi
          if ! ls osm/*-teil.osm.pbf >/dev/null 2>&1; then
            # Fassung 60: letzter guter Auszug aus dem Zwischenspeicher statt gar keiner Linienwege
            if [ -s osm-vorrat/auszug.opl ]; then
              cp osm-vorrat/*.opl osm-vorrat/*.geojsonseq osm/ 2>/dev/null || true
              echo "GOEBUS_OSM_VORRAT=$(cat osm-vorrat/stand.txt 2>/dev/null || echo unbekannt)" >> "$GITHUB_ENV"
              # Fassung 65: Planmäßig (Vorrat jünger als 2 Tage, openstreetmap.fr wird nur alle 2 Tage geladen) nur ein Hinweis, keine Warnung
              if { [ "${OSM_FR:-}" = 1 ] || [ "${VORRAT_HEUTE:-}" = 1 ]; } && [ -n "${OSM_VORRAT_TAGE:-}" ] && [ "${OSM_VORRAT_TAGE}" -lt 2 ]; then
                echo "::notice::Planmäßig der OpenStreetMap-Auszug vom $(cat osm-vorrat/stand.txt) (openstreetmap.fr wird nur alle 2 Tage geladen)"
                echo "GOEBUS_OSM_PLANMAESSIG=1" >> "$GITHUB_ENV"
              else
                echo "::warning::Kein neuer OpenStreetMap-Auszug – nutze den letzten guten vom $(cat osm-vorrat/stand.txt 2>/dev/null || echo '?')"
              fi
            else
              echo "::warning::Kein Auszug geladen und keiner im Vorrat – das Skript fragt Overpass (von GitHub aus meist gesperrt)"
            fi
            exit 0
          fi
          osmium merge osm/*-teil.osm.pbf -o osm/alles.osm.pbf --overwrite
          osmium tags-filter osm/alles.osm.pbf r/route=bus,trolleybus,minibus,share_taxi,tram -o osm/routen.osm.pbf --overwrite
          osmium cat osm/routen.osm.pbf -f opl,add_metadata=false -o osm/auszug.opl --overwrite
          # Fassung 68: Plausibilität – ein unvollständiger Auszug (abgebrochener Download, fehlendes Gebiet) darf den guten Vorrat nicht
          # ersetzen. Maßstab: Zahl der Linien-Relationen, mindestens 1500 und mindestens 70 % des Vorrats.
          # Verglichen wird nur mit einem Vorrat derselben Quelle (Geofabrik: ganze Länder, openstreetmap.fr: Ausschnitt) und höchstens 7 Tage alt.
          n_neu=$(grep -c '^r' osm/auszug.opl || true); n_alt=0
          q_neu="${OSM_QUELLE_DATEI:-}"; [ -z "$q_neu" ] && { ls osm/region-teil.osm.pbf >/dev/null 2>&1 && q_neu=openstreetmap.fr || q_neu=geofabrik; }
          if [ -s osm-vorrat/auszug.opl ] && [ "$(cat osm-vorrat/quelle.txt 2>/dev/null)" = "$q_neu" ] && [ "${OSM_VORRAT_TAGE:-99}" -le 7 ]; then n_alt=$(grep -c '^r' osm-vorrat/auszug.opl || true); fi
          echo "$(date +%T) Linien-Relationen: neu $n_neu ($q_neu), Vergleich mit dem Vorrat: $n_alt"
          if [ "${n_neu:-0}" -lt 1500 ] || [ $(( ${n_neu:-0} * 10 )) -lt $(( ${n_alt:-0} * 7 )) ]; then
            echo "::warning::Neuer OpenStreetMap-Auszug unplausibel ($n_neu Linien-Relationen, Vorrat $n_alt) – nutze den Vorrat"
            if [ -s osm-vorrat/auszug.opl ]; then
              cp osm-vorrat/*.opl osm-vorrat/*.geojsonseq osm/ 2>/dev/null || true
              echo "GOEBUS_OSM_VORRAT=$(cat osm-vorrat/stand.txt 2>/dev/null || echo unbekannt)" >> "$GITHUB_ENV"
            fi
            exit 0
          fi
          osmium tags-filter osm/alles.osm.pbf nwr/amenity=driving_school -o osm/fahrschulen.osm.pbf --overwrite
          osmium cat osm/fahrschulen.osm.pbf -f opl,add_metadata=false -o osm/fahrschulen.opl --overwrite
          echo "$(date +%T) Linien und Fahrschulen fertig"
          # Fassung 67: Haltestellen und Orte rund um den Landkreis Hildesheim (Schülerverkehr)
          ( osmium tags-filter osm/alles.osm.pbf n/highway=bus_stop n/public_transport=platform n/place=city,town,village,suburb,hamlet,isolated_dwelling -o osm/halte-alle.osm.pbf --overwrite \
            && osmium extract -b 9.45,51.72,10.55,52.45 osm/halte-alle.osm.pbf -o osm/halte.osm.pbf --overwrite \
            && osmium export osm/halte.osm.pbf -f geojsonseq --geometry-types=point -o osm/halte.geojsonseq --overwrite ) \
            || echo "::warning::Haltestellen aus OpenStreetMap nicht erstellt – Schülerverkehr nur mit den Fahrplandaten"
          # Gemeinden und Samtgemeinden (admin_level 7 und 8) als Flächen für AST-Gebiete – zuletzt und mit eigener Zeitgrenze
          ( timeout 300 osmium tags-filter osm/alles.osm.pbf r/admin_level=7,8 -o osm/gemeinden.osm.pbf --overwrite \
            && timeout 300 osmium export osm/gemeinden.osm.pbf -f geojsonseq --geometry-types=polygon -o osm/gemeinden.geojsonseq --overwrite ) \
            || echo "::warning::Gemeindegrenzen nicht erstellt – AST-Gebiete aus den Haltestellen"
          # Fassung 60: guten Auszug für spätere Läufe aufheben
          mkdir -p osm-vorrat && cp osm/auszug.opl osm/fahrschulen.opl osm-vorrat/ && { cp osm/gemeinden.geojsonseq osm/halte.geojsonseq osm-vorrat/ 2>/dev/null || true; } && date -u +%F > osm-vorrat/stand.txt && echo "$q_neu" > osm-vorrat/quelle.txt \
            && echo "OSM_NEU=1" >> "$GITHUB_ENV"
          ls -la osm

      - name: OpenStreetMap-Auszug für spätere Läufe speichern
        # Fassung 65: nur, wenn es einen neuen Auszug gibt (vorher bei jedem Lauf 45 MB derselben Daten)
        if: ${{ env.OSM_NEU == '1' && hashFiles('osm-vorrat/stand.txt') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5   # Fassung 63: Node 24
        with:
          path: osm-vorrat
          key: osm-${{ github.run_id }}

      - name: Eigenen Routenplaner bauen und starten (OSRM, Bus-Profil)
        # Fassung 61: Statt des öffentlichen Servers (höchstens eine Anfrage je Sekunde) rechnet ein eigener OSRM im Lauf –
        # alle Skizzen in einem Lauf, mit Bus-Profil (osrm-bus.lua). Klappt etwas nicht, nimmt das Skript wie bisher den
        # öffentlichen Server; der Lauf geht weiter.
        continue-on-error: true
        timeout-minutes: 35
        run: |
          mkdir -p osrm
          IMG=ghcr.io/project-osrm/osrm-backend:v26.10.0-debian    # geprüft am 22.11.2026 (Profile liegen unter /opt)
          docker pull -q "$IMG" || { IMG=ghcr.io/project-osrm/osrm-backend:latest; docker pull -q "$IMG"; }
          if [ "${OSRM_BAUEN:-}" = 1 ] && ls osm/*-strassen.osm.pbf >/dev/null 2>&1; then
            echo "$(date +%T) Straßen zusammenführen"
            osmium merge osm/*-strassen.osm.pbf -o osm/strassen.osm.pbf --overwrite
            osmium extract -b 8.2,50.6,11.8,52.9 osm/strassen.osm.pbf -o osm/region.osm.pbf --overwrite
            rm -f osm/*-strassen.osm.pbf osm/strassen.osm.pbf
            docker run --rm "$IMG" cat /opt/car.lua > osm/car.lua
            # Bus-Teil vor dem abschließenden „return {“ der Kopie von car.lua einfügen
            awk 'FNR==NR { z[++n] = $0; next } { b[++m] = $0 } END { for (i = m; i > 0; i--) if (b[i] ~ /^return[ ]*\{/) { r = i; break }
                 for (i = 1; i <= m; i++) { if (i == r) for (j = 1; j <= n; j++) print z[j]; print b[i] } }' osrm-bus.lua osm/car.lua > osm/bus.lua
            grep -q "GöBUS Fassung 61" osm/bus.lua && grep -q "Fassung 63" osm/bus.lua || { echo "::warning::Bus-Profil nicht eingefügt – Auto-Profil"; cp osm/car.lua osm/bus.lua; }
            rm -rf osrm-neu && mkdir osrm-neu && mv osm/region.osm.pbf osrm-neu/
            echo "$(date +%T) osrm-extract"
            docker run --rm -v "$PWD/osrm-neu:/data" -v "$PWD/osm/bus.lua:/opt/bus.lua:ro" "$IMG" osrm-extract -p /opt/bus.lua /data/region.osm.pbf
            docker run --rm -v "$PWD/osrm-neu:/data" "$IMG" osrm-partition /data/region.osrm
            docker run --rm -v "$PWD/osrm-neu:/data" "$IMG" osrm-customize /data/region.osrm
            # Fassung 63: Docker legt die Dateien als root an (region.osrm.fileIndex nur für root lesbar) – am 22.11. scheiterte
            # deshalb das Speichern im Zwischenspeicher („Permission denied“). Dateien dem Lauf übergeben.
            sudo chown -R "$(id -u):$(id -g)" osrm-neu && chmod -R u+rwX,go+rX osrm-neu
            rm -f osrm-neu/region.osm.pbf && date -u +%F > osrm-neu/stand.txt
            rm -rf osrm && mv osrm-neu osrm && echo "OSRM_NEU=1" >> "$GITHUB_ENV"
            echo "$(date +%T) Routenplaner gebaut"; du -sh osrm
          fi
          if ls osrm/region.osrm* >/dev/null 2>&1; then
            docker run -d --name osrm -p 127.0.0.1:5000:5000 -v "$PWD/osrm:/data" "$IMG" osrm-routed --algorithm mld --max-viaroute-size 1000 /data/region.osrm
            for i in $(seq 1 60); do curl -sf "http://127.0.0.1:5000/route/v1/driving/9.926800,51.536500;9.935900,51.533200" >/dev/null && break; sleep 2; done
            if curl -sf "http://127.0.0.1:5000/route/v1/driving/9.926800,51.536500;9.935900,51.533200" >/dev/null; then
              echo "GOEBUS_SKIZZE_URL=http://127.0.0.1:5000/route/v1/driving/" >> "$GITHUB_ENV"
              echo "GOEBUS_SKIZZE_PROFIL=Bus (Straßen vom $(cat osrm/stand.txt 2>/dev/null || echo '?'))" >> "$GITHUB_ENV"
              echo "Eigener Routenplaner bereit"
            else
              echo "::warning::Eigener Routenplaner antwortet nicht – Skizzen über den öffentlichen Server"; docker logs osrm | tail -20
            fi
          else
            echo "::warning::Keine Routenplaner-Daten – Skizzen über den öffentlichen Server"
          fi

      - name: Routenplaner-Daten für spätere Läufe speichern
        if: ${{ env.OSRM_NEU == '1' }}
        continue-on-error: true
        uses: actions/cache/save@v5   # Fassung 63: Node 24
        with:
          path: osrm
          key: osrm-bus-v2-${{ env.WOCHE }}

      - name: Schülerverkehr – PDF-Leser installieren
        # Fassung 67: pdfplumber liest die Fahrpläne des Schülerverkehrs (Landkreis Hildesheim). Schlägt das fehl, bleibt nur dieser Teil aus.
        continue-on-error: true
        # Fassung 68: dazu tesseract (deutsch) für Fahrpläne, die nur als Bild oder Scan vorliegen (Webseite der Grundschule Sibbesse)
        timeout-minutes: 8
        run: |
          python -m pip install --quiet --disable-pip-version-check pdfplumber==0.11.4 || python -m pip install --quiet --user pdfplumber
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-deu >/dev/null 2>&1 \
            || { sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-deu >/dev/null 2>&1; } \
            || echo "::notice::Texterkennung (tesseract) nicht installiert – Fahrpläne als Bild bleiben ohne Fahrten"
          tesseract --version 2>/dev/null | head -1 || true

      - name: Fahrplandaten und OpenStreetMap verarbeiten
        # Version 2.2: Regeln der Website (ersetzte Linien wie 265 → 260). Adresse der Website als Variable GOEBUS_ADRESSE
        # (Settings → Secrets and variables → Actions → Variables); ohne Variable läuft alles wie bisher.
        timeout-minutes: 80    # Fassung 59: Verarbeitung gut 6 Minuten + Skizzen bis 45 Minuten (GOEBUS_SKIZZE_MINUTEN); Fassung 69: + E-Fahrten bis 8 Minuten
        env:
          GOEBUS_SKIZZE_MINUTEN: ${{ vars.GOEBUS_SKIZZE_MINUTEN || '45' }}
          GOEBUS_REGELN: ${{ vars.GOEBUS_ADRESSE != '' && format('{0}/_data/verbund-tarife/linien-regeln.json', vars.GOEBUS_ADRESSE) || '' }}
          GOEBUS_SCHUL_MINUTEN: ${{ vars.GOEBUS_SCHUL_MINUTEN || '8' }}
          GOEBUS_EF_MINUTEN: ${{ vars.GOEBUS_EF_MINUTEN || '8' }}    # Fassung 69: E-Fahrten (SVHI, RVHI, GöVB-E-Wagen, Frühwagen)
        run: python liniennetz.py --ausgabe daten --osm-auszug osm/auszug.opl --gemeinden osm/gemeinden.geojsonseq --osm-halte osm/halte.geojsonseq

      - name: Fahrschulen mit Busführerschein suchen
        # Fassung 42: OpenStreetMap (Fassung 48: aus dem Auszug) und Websites der Fahrschulen. Schlägt dieser Schritt fehl,
        # bleibt das Liniennetz davon unberührt.
        if: ${{ !cancelled() && hashFiles('fahrschulen.py') != '' }}
        continue-on-error: true
        timeout-minutes: 15
        run: python fahrschulen.py --ausgabe daten --osm-auszug osm/fahrschulen.opl

      - name: Ergebnis speichern
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GöBUS Liniennetz"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Liniennetz $(date +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 10; done
          exit 1
